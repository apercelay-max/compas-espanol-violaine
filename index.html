<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Compás</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#171A2C;
  --ink-soft:#565C77;
  --ink-faint:#8B8FA6;
  --paper:#FAF6EF;
  --surface:#FFFFFF;
  --surface-2:#F2ECDC;
  --border:#E5DCC6;
  /* Rojo y gualda — bandera de España */
  --yellow:#F1BF00;
  --yellow-soft:#FCEEB0;
  --yellow-ink:#5C4300;
  --red:#C8102E;
  --red-soft:#FBDADD;
  --red-ink:#7A1220;
  /* Verde y blanco — bandera de Andalucía */
  --green:#1C8A4B;
  --green-bright:#4CC98A;
  --green-glow:rgba(28,138,75,.35);
  --green-soft:#DCF3E4;
  --green-ink:#0F4A29;
  --focus:var(--green);
  --surface-a:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(23,26,44,.04), 0 8px 24px -12px rgba(23,26,44,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F1EDE2;
    --ink-soft:#B7BCD4;
    --ink-faint:#7C81A0;
    --paper:#12141F;
    --surface:#1B1E2C;
    --surface-2:#242739;
    --border:#333752;
    --yellow:#FFD23F;
    --yellow-soft:#3D2E00;
    --yellow-ink:#FFE9A8;
    --red:#FF6B5E;
    --red-soft:#3A1613;
    --red-ink:#FFC6BE;
    --green:#4CC98A;
    --green-bright:#8FE8B8;
    --green-glow:rgba(76,201,138,.45);
    --green-soft:#123420;
    --green-ink:#B7EACB;
    --surface-a:rgba(27,30,44,.9);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ink:#F1EDE2;
  --ink-soft:#B7BCD4;
  --ink-faint:#7C81A0;
  --paper:#12141F;
  --surface:#1B1E2C;
  --surface-2:#242739;
  --border:#333752;
  --yellow:#FFD23F;
  --yellow-soft:#3D2E00;
  --yellow-ink:#FFE9A8;
  --red:#FF6B5E;
  --red-soft:#3A1613;
  --red-ink:#FFC6BE;
  --green:#4CC98A;
  --green-bright:#8FE8B8;
  --green-glow:rgba(76,201,138,.45);
  --green-soft:#123420;
  --green-ink:#B7EACB;
  --surface-a:rgba(27,30,44,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background-image:
    radial-gradient(600px 400px at 15% -5%, var(--yellow-soft), transparent),
    radial-gradient(500px 400px at 100% 10%, var(--green-soft), transparent);
  background-attachment:fixed;
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif; text-wrap:balance;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px;}
::selection{background:var(--yellow-soft); color:var(--yellow-ink);}

.app-shell{
  max-width:472px;
  margin:0 auto;
  min-height:100dvh;
  background:var(--surface);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  position:relative;
}
@media (min-width:560px){
  body{padding:28px 12px;}
  .app-shell{min-height:calc(100dvh - 56px); border-radius:28px; overflow:hidden; border:1px solid var(--border);}
}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 14px;
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:5;
  background:var(--surface-a);
  backdrop-filter:blur(6px);
}
.wordmark{font-family:'Fraunces',serif; font-weight:600; font-size:1.3rem; letter-spacing:-.01em; margin:0; display:flex; align-items:baseline; gap:2px;}
.wordmark .accent-dot{color:var(--green); font-size:1rem;}
.topbar-meta{display:flex; align-items:center; gap:10px;}
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:.78rem; font-weight:700; padding:5px 10px 5px 9px; border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.pill-level{background:var(--yellow-soft); color:var(--yellow-ink);}
.pill-streak{background:var(--red-soft); color:var(--red-ink);}

.main{flex:1; padding:20px 20px 12px; overflow-x:hidden;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  display:flex; border-top:1px solid var(--border);
  position:sticky; bottom:0; background:var(--surface); z-index:5;
}
.navbtn{
  flex:1; background:none; border:none; padding:12px 4px 14px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--ink-faint); font-size:.72rem; font-weight:700; letter-spacing:.01em;
  border-top:2px solid transparent; transition:color .15s;
}
.navbtn .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0;}
.navbtn.active{color:var(--green); border-top-color:var(--green);}
.navbtn.active .dot{opacity:1;}
.navbtn:hover{color:var(--ink-soft);}
.navbtn.active:hover{color:var(--green);}

/* ---------- Dashboard ---------- */
.hero-card{
  background:linear-gradient(155deg, var(--surface-2), var(--surface));
  border:1px solid var(--border); border-radius:20px; padding:20px;
  margin-bottom:20px;
}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
.hero-greet{margin:0 0 2px; font-size:1.3rem; font-weight:600;}
.hero-sub{margin:0; color:var(--ink-soft); font-size:.88rem;}
.prog-row{margin-top:16px;}
.prog-labels{display:flex; justify-content:space-between; gap:10px; font-size:.76rem; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.prog-labels span:last-child{font-variant-numeric:tabular-nums; white-space:nowrap;}
.prog-track{height:8px; border-radius:999px; background:var(--border); overflow:hidden;}
.prog-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--yellow), var(--red)); transition:width .5s ease;}
.prog-note{margin:8px 0 0; font-size:.76rem; color:var(--ink-faint); line-height:1.4;}

.day-banner{
  display:flex; align-items:center; gap:10px;
  background:var(--green-soft); color:var(--green-ink); border-radius:14px;
  padding:12px 14px; margin-bottom:16px; font-size:.85rem; font-weight:600;
}

.session-list{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.session-card{
  display:flex; align-items:center; gap:14px;
  border:1px solid var(--border); border-radius:16px; padding:14px 16px;
  background:var(--surface); position:relative; overflow:hidden;
}
.session-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px;}
.session-card.c-vocab::before{background:var(--yellow);}
.session-card.c-grammar::before{background:var(--ink-soft);}
.session-body{flex:1; min-width:0;}
.session-title{font-weight:700; font-size:1rem; margin:0 0 2px;}
.session-desc{margin:0; font-size:.8rem; color:var(--ink-soft); line-height:1.4;}
.session-tag{font-size:.68rem; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:6px; display:block;}
.btn{
  appearance:none; border:none; cursor:pointer; border-radius:12px;
  font-weight:700; font-size:.86rem; padding:10px 16px;
  transition:transform .1s, filter .15s; white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-yellow{background:var(--yellow); color:#211405;}
.btn-green{background:var(--green); color:#06201d;}
.btn-ghost{background:var(--surface-2); color:var(--ink);}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--ink-soft);}
.btn-wide{width:100%;}
.btn-lg{padding:14px 18px; font-size:.95rem; border-radius:14px;}
.btn[disabled]{opacity:.5; cursor:default;}
.check-badge{display:flex; align-items:center; gap:6px; color:var(--green); font-weight:700; font-size:.82rem; white-space:nowrap;}

.quote-card{
  border:1px dashed var(--border); border-radius:16px; padding:16px 18px; text-align:center;
}
.quote-es{font-family:'Fraunces',serif; font-style:italic; font-size:1.05rem; margin:0 0 4px;}
.quote-fr{font-size:.78rem; color:var(--ink-faint); margin:0;}

/* ---------- Session header ---------- */
.session-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.session-header h2{margin:0; font-size:1.15rem;}
.iconbtn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); font-size:1rem;
}
.progress-strip{height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-bottom:22px;}
.progress-strip > div{height:100%; border-radius:999px; transition:width .3s ease;}
.vocab-meta{display:flex; justify-content:space-between; gap:6px; margin-bottom:18px; padding:12px 6px; border:1px solid var(--border); border-radius:14px; background:var(--surface-2);}
.vm-item{display:flex; flex-direction:column; align-items:center; flex:1; min-width:0;}
.vm-num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.1rem; font-variant-numeric:tabular-nums; color:var(--ink);}
.vm-label{font-size:.6rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-top:3px; text-align:center;}

/* ---------- Flashcard (volteo 3D) ---------- */
.flashcard-wrap{display:flex; flex-direction:column; align-items:center; gap:22px; padding-top:6px;}
.flashcard{width:100%; min-height:296px; cursor:pointer; position:relative; perspective:1400px;}
.flip-inner{
  position:relative; width:100%; height:100%; min-height:296px;
  transition:transform .5s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d;
}
.flashcard.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:22px; border:1px solid var(--border);
  background:linear-gradient(160deg, var(--surface-2), var(--surface));
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  /* marge haute : laisse passer le bouton 🔊 sans chevaucher l'étiquette de thème */
  padding:56px 20px 24px; gap:10px; overflow-y:auto;
}
.flip-back{transform:rotateY(180deg); pointer-events:none;}
.flashcard.flipped .flip-front{pointer-events:none;}
.flashcard.flipped .flip-back{pointer-events:auto;}
@media (prefers-reduced-motion: reduce){ .flip-inner{transition:none;} }
.speak-btn{
  position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--green);
  font-size:1.05rem; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.speak-btn:hover{border-color:var(--green);}
.fav-btn{
  position:absolute; top:14px; left:14px; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--ink-faint);
  font-size:1.15rem; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.fav-btn:hover{border-color:var(--yellow);}
.fav-btn.active{color:var(--yellow-ink); background:var(--yellow-soft); border-color:var(--yellow);}
.flashcard .theme-tag{font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--yellow-ink); background:var(--yellow-soft); padding:2px 8px; border-radius:999px; font-weight:800;}
.flashcard .side-tag{font-size:.64rem; text-transform:uppercase; letter-spacing:.12em; font-weight:800; color:var(--ink-faint); margin:0;}
/* Recto : le mot à deviner, en français */
.flashcard .prompt-word{font-size:1.8rem; font-weight:800; letter-spacing:-.01em; line-height:1.2; margin:2px 0;}
.flashcard .prompt-word.arrive{animation:wordArrive .5s cubic-bezier(.2,.8,.3,1.2) both;}
@keyframes wordArrive{ from{opacity:0; transform:translateY(12px) scale(.94);} to{opacity:1; transform:translateY(0) scale(1);} }
@media (prefers-reduced-motion: reduce){ .flashcard .prompt-word.arrive{animation:none;} }
/* Verso : la réponse, en espagnol */
.flashcard .answer-word{font-family:'Fraunces',serif; font-weight:600; font-size:2rem; line-height:1.2; margin:2px 0; color:var(--green-ink);}
.flashcard .echo-word{font-size:.98rem; color:var(--ink-faint); font-weight:600; margin:0;}
.flashcard .example{margin-top:10px; font-size:.85rem; color:var(--ink-soft); line-height:1.5;}
.flashcard .hint{font-size:.78rem; color:var(--ink-faint); margin-top:4px;}
.flashcard kbd{margin:0 .15em;}
.rate-row{display:flex; gap:12px; width:100%;}
.rate-row .btn{flex:1;}

/* ---------- Grammar ---------- */
.lesson-panel{background:var(--surface-2); border-radius:18px; padding:18px 18px 16px; margin-bottom:18px; border:1px solid var(--border);}
.lesson-panel h3{margin:0 0 8px; font-size:1.05rem;}
.lesson-panel p{margin:0 0 10px; font-size:.9rem; line-height:1.6; color:var(--ink-soft);}
.lesson-panel p:last-child{margin-bottom:0;}
.lesson-panel table{width:100%; border-collapse:collapse; margin:10px 0; font-size:.85rem;}
.lesson-panel td{padding:5px 6px; border-bottom:1px solid var(--border);}
.lesson-panel td:first-child{color:var(--ink-faint); font-weight:600;}
.exercise-card{border:1px solid var(--border); border-radius:18px; padding:18px; background:var(--surface);}
.ex-count{font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; display:block;}
.ex-prompt{font-size:1.05rem; font-weight:600; margin:0 0 16px; line-height:1.5;}
.ex-prompt em{color:var(--yellow-ink); font-style:normal; border-bottom:2px solid var(--yellow); background:var(--yellow-soft); padding:0 3px; border-radius:4px;}
.opt-list{display:flex; flex-direction:column; gap:9px;}
.opt-btn{
  text-align:left; border:1.5px solid var(--border); background:var(--surface); border-radius:12px;
  padding:11px 14px; font-size:.92rem; font-weight:600; cursor:pointer; color:var(--ink);
}
.opt-btn:hover{border-color:var(--green);}
.opt-btn.correct{border-color:var(--green); background:var(--green-soft); color:var(--green-ink);}
.opt-btn.wrong{border-color:var(--red); background:var(--red-soft); color:var(--red-ink);}
.opt-btn[disabled]{cursor:default;}
.fill-row{display:flex; gap:10px;}
.fill-input{
  flex:1; border:1.5px solid var(--border); border-radius:12px; padding:11px 14px;
  font-size:.95rem; font-family:inherit; background:var(--surface); color:var(--ink);
}
.fill-input:focus{border-color:var(--green);}
.fill-input.correct{border-color:var(--green); background:var(--green-soft);}
.fill-input.wrong{border-color:var(--red); background:var(--red-soft);}
.fill-input.near{border-color:var(--yellow); background:var(--yellow-soft);}
.feedback{margin-top:14px; padding:12px 14px; border-radius:12px; font-size:.86rem; line-height:1.5;}
.feedback.ok{background:var(--green-soft); color:var(--green-ink);}
.feedback.ko{background:var(--red-soft); color:var(--red-ink);}
.feedback.near{background:var(--yellow-soft); color:var(--yellow-ink);}
.feedback b{font-weight:800;}

/* ---------- Modo coche ---------- */
.car-overlay{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:#0a0a0a;}
.car-exit{
  position:absolute; top:14px; right:14px; z-index:10;
  width:44px; height:44px; border-radius:50%; border:none;
  background:rgba(255,255,255,.1); color:#9497ab;
  display:flex; align-items:center; justify-content:center; font-size:1.05rem; cursor:pointer;
}
.car-overlay{background:radial-gradient(120% 80% at 50% 0%, #1a1c2a 0%, #0a0a0f 70%);}
.car-text{flex:0 1 auto; padding:max(58px,calc(env(safe-area-inset-top) + 40px)) 34px 14px; text-align:center; display:flex; flex-direction:column; gap:14px; overflow:auto; min-height:0; max-height:44%;}
.car-text .car-fr{font-size:clamp(1.35rem,5.6vw,2.1rem); font-weight:700; line-height:1.22; color:#aeb2c8;}
.car-text .car-es{font-family:'Fraunces',Georgia,serif; font-size:clamp(1.8rem,8vw,3.1rem); font-weight:600; line-height:1.15; color:#fff;}
.car-pad{flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; padding:6px 38px max(34px,calc(env(safe-area-inset-bottom) + 26px));}
.car-btn{
  flex:1; min-height:0; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
  border-radius:26px; display:flex; align-items:center; justify-content:center; gap:14px;
  font-family:inherit; font-size:1.25rem; font-weight:800; letter-spacing:.02em;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.18);
  transition:transform .08s, box-shadow .12s;
}
.car-btn .car-ico{font-size:1.6rem; line-height:1;}
.car-btn:active{transform:scale(.97);}
.car-btn.sel{box-shadow:0 0 0 4px rgba(255,255,255,.92), 0 10px 24px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.22);}
.car-btn-known{background:linear-gradient(160deg,#FFD23F,#F1BF00); color:#3a2a00;}
.car-btn-repeat{background:linear-gradient(160deg,#2a2c3a,#0d0d12); color:#e8e9f2; border:1.5px solid rgba(255,255,255,.14);}
.car-btn-next{background:linear-gradient(160deg,#1C8A4B,#0F4A29); color:#eafff2;}
.car-btn-review{background:linear-gradient(160deg,#E0233F,#C8102E); color:#fff;}

/* ---------- Completion ---------- */
.done-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 8px;}
.done-badge{
  width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:2.1rem; margin-bottom:18px;
}
.done-wrap h2{margin:0 0 6px;}
.done-wrap p{color:var(--ink-soft); margin:0 0 22px; font-size:.9rem;}
.done-note{font-size:.76rem !important; color:var(--ink-faint) !important; margin:-12px 0 20px !important; line-height:1.5; max-width:300px;}
.done-levelup{color:var(--green-ink) !important; background:var(--green-soft); border-radius:12px; padding:10px 14px; font-weight:700; margin:0 0 16px !important;}
.gain-chip{display:inline-flex; align-items:center; gap:6px; background:var(--yellow-soft); color:var(--yellow-ink); font-weight:800; font-size:.85rem; padding:7px 14px; border-radius:999px; margin-bottom:22px;}

/* ---------- Vocabulario : situations de la vie quotidienne ---------- */
.sec-intro{font-size:.85rem; color:var(--ink-soft); line-height:1.5; margin:0 0 14px;}
.sec-hint{font-size:.76rem; color:var(--ink-faint); margin:10px 0 0; text-align:center; font-variant-numeric:tabular-nums;}
.sec-list{display:flex; flex-direction:column; gap:8px;}
.sec-btn{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  border:1px solid var(--border); border-radius:14px; padding:11px 14px;
  background:var(--surface); color:var(--ink); cursor:pointer; font-family:inherit;
}
.sec-btn:hover{border-color:var(--green);}
.sec-btn:active{transform:scale(.99);}
.sec-btn.done{background:var(--green-soft); border-color:var(--green);}
.sec-emoji{font-size:1.2rem; flex:none; width:24px; text-align:center; line-height:1;}
.sec-body{flex:1; min-width:0;}
.sec-name{display:block; font-weight:700; font-size:.9rem; line-height:1.3;}
.sec-bar{display:block; height:5px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:6px;}
.sec-bar > i{display:block; height:100%; background:var(--yellow); border-radius:999px;}
.sec-btn.done .sec-bar > i{background:var(--green);}
.sec-count{flex:none; font-family:'JetBrains Mono',monospace; font-size:.76rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

/* ---------- Stats ---------- */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;}
.stat-tile{border:1px solid var(--border); border-radius:16px; padding:16px; background:var(--surface-2);}
.stat-num{font-family:'JetBrains Mono',monospace; font-size:1.7rem; font-weight:700; font-variant-numeric:tabular-nums; display:block;}
.stat-label{font-size:.76rem; color:var(--ink-soft); font-weight:600;}
.theme-progress{display:flex; flex-direction:column; gap:10px;}
.tp-row{display:flex; align-items:center; gap:10px;}
.tp-name{flex:0 0 150px; font-size:.8rem; color:var(--ink-soft); font-weight:600; line-height:1.3;}
.tp-track{flex:1; height:7px; background:var(--border); border-radius:999px; overflow:hidden;}
.tp-fill{height:100%; background:var(--yellow); border-radius:999px;}
.tp-count{flex:0 0 42px; text-align:right; font-size:.76rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
.section-label{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:22px 0 10px;}
.section-label:first-child{margin-top:0;}

/* ---------- Settings ---------- */
.settings-group{border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:18px;}
.settings-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row .label{font-weight:700; font-size:.92rem;}
.settings-row .desc{font-size:.78rem; color:var(--ink-soft); margin-top:2px;}
.switch{width:44px; height:26px; border-radius:999px; background:var(--border); position:relative; cursor:pointer; border:none; flex:none;}
.switch.on{background:var(--green);}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s;}
.switch.on::after{left:21px;}
.level-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.level-btn{border:1.5px solid var(--border); border-radius:12px; padding:12px; text-align:left; background:var(--surface); cursor:pointer;}
.level-btn.active{border-color:var(--yellow); background:var(--yellow-soft);}
.level-btn b{display:block; font-size:.95rem;}
.level-btn span{font-size:.75rem; color:var(--ink-soft);}

/* ---------- Onboarding ---------- */
.onb-wrap{padding:30px 22px; min-height:100dvh; display:flex; flex-direction:column;}
.onb-mark{font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin:0 0 6px;}
.onb-tag{color:var(--ink-soft); font-size:.95rem; margin:0 0 30px; line-height:1.5;}
.onb-feature{display:flex; gap:12px; align-items:flex-start; margin-bottom:16px;}
.onb-dot{width:8px; height:8px; border-radius:50%; margin-top:7px; flex:none;}
.onb-feature b{display:block; font-size:.92rem;}
.onb-feature span{font-size:.82rem; color:var(--ink-soft);}
.onb-choices{margin-top:auto; padding-top:26px;}
.sync-note{display:flex; align-items:center; gap:8px; font-size:.75rem; color:var(--ink-faint); margin-top:14px; justify-content:center;}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--green);}

/* ---------- Franja bandera (acento de marca) ---------- */
.flag-stripe{display:flex; height:4px; border-radius:999px; overflow:hidden; width:52px;}
.flag-stripe span{flex:1;}
.flag-stripe .r1,.flag-stripe .r2{background:var(--red);}
.flag-stripe .y{background:var(--yellow);}
.flag-stripe.andalucia .g1,.flag-stripe.andalucia .g2{background:var(--green);}
.flag-stripe.andalucia .w{background:#fff;}

/* ---------- Atajos de teclado ---------- */
kbd{
  font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--ink-soft);
  background:var(--surface-2); border:1px solid var(--border); border-bottom-width:2px;
  border-radius:5px; padding:.08em .42em;
}
.kbd-hint{font-size:.74rem; color:var(--ink-faint); margin-top:2px; text-align:center;}

/* ---------- Récapitulatif de fin de séance ---------- */
.recap{width:100%; text-align:left; margin:2px 0 22px; border-top:1px solid var(--border);}
.recap-title{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:16px 0 4px;}
.recap-item{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); align-items:flex-start;}
.recap-mark{width:1.5rem; flex:none; font-weight:800; font-size:.85rem; line-height:1.4;}
.recap-mark.bad{color:var(--red);}
.recap-mark.near{color:var(--yellow-ink);}
.recap-body{flex:1; min-width:0; font-size:.85rem; line-height:1.5; color:var(--ink-soft);}
.recap-body b{color:var(--ink); font-weight:700;}
.recap-you{color:var(--red-ink); font-weight:600;}
.recap-you.near{color:var(--yellow-ink);}

@media (max-width:360px){
  .flashcard .prompt-word,
  .flashcard .answer-word{font-size:1.5rem;}
}
</style>

{id:"g11",lvl:"B1",title:"Le subjonctif présent — formation",
 html:"<p>On part du présent de l'indicatif à la 1ère personne (« yo »), on enlève le -o, puis on ajoute les terminaisons <b>inversées</b> : verbes en -AR → -e, -es, -e, -emos, -éis, -en ; verbes en -ER/-IR → -a, -as, -a, -amos, -áis, -an. Cela conserve les irrégularités du présent : tener→tengo→<b>tenga</b>, hacer→hago→<b>haga</b>, conocer→conozco→<b>conozca</b>.</p>",
 exercises:[
  {type:"fill",prompt:"hablar → que yo <em>___</em>",answer:"hable",explain:"hablar (yo hablo) → hable."},
  {type:"fill",prompt:"tener → que tú <em>___</em>",answer:"tengas",explain:"tener (yo tengo) → tengas."},
  {type:"fill",prompt:"hacer → que nosotros <em>___</em>",answer:"hagamos",explain:"hacer (yo hago) → hagamos."},
  {type:"fill",prompt:"vivir → que ellos <em>___</em>",answer:"vivan",explain:"vivir (yo vivo) → vivan."},
  {type:"qcm",prompt:"Le subjonctif présent des verbes en -ER se termine, à la 1ère personne, en :",options:["-a","-e","-o"],answer:0,explain:"Les verbes en -ER/-IR prennent les terminaisons du subjonctif en -a (inversion)."}
]},
{id:"g12",lvl:"B1",title:"Le subjonctif après le doute, le désir et le sentiment",
 html:"<p>On emploie <b>que + subjonctif</b> après des expressions de volonté (querer que), de sentiment (alegrarse de que, es una pena que), de doute (dudar que) ou de nécessité (es importante que) — quand le sujet change entre les deux propositions. Sans changement de sujet, on utilise l'infinitif : « Quiero salir » (pas de subjonctif) vs « Quiero que salgas » (subjonctif).</p>",
 exercises:[

  {type:"fill",prompt:"Me <em>___</em> (gustar) un café, por favor. (politesse)",answer:"gustaría",explain:"gustar → gustaría (conditionnel de politesse)."},
  {type:"fill",prompt:"Yo que tú, le <em>___</em> (decir) la verdad. (irrégulier)",answer:"diría",explain:"decir → diría (radical irrégulier dir-)."},
  {type:"fill",prompt:"¿<em>___</em> (poder/tú) ayudarme un momento? (irrégulier, politesse)",answer:"podrías",explain:"poder → podrías (radical irrégulier podr-)."},
  {type:"fill",prompt:"Con más tiempo, nosotros <em>___</em> (viajar) por todo el país.",answer:"viajaríamos",explain:"viajar → viajaríamos."},
  {type:"qcm",prompt:"Le conditionnel se forme en ajoutant les terminaisons à :",options:["l'infinitif (ou radical irrégulier)","au radical du présent"],answer:0,explain:"Comme le futur, le conditionnel s'appuie sur l'infinitif ou le radical irrégulier."}
]},
{id:"g14",lvl:"B1",title:"Por vs Para",
 html:"<p><b>PARA</b> : destination, but, destinataire, délai/échéance, opinion personnelle (« para mí »). <b>POR</b> : cause/motif, moyen, échange, durée approximative, lieu de passage (« por »). Ex : « Este regalo es <b>para</b> ti » (destinataire) vs « Gracias <b>por</b> el regalo » (motif) ; « Salgo <b>para</b> Madrid » (destination) vs « Paso <b>por</b> Madrid » (passage).</p>",
 exercises:[
  {type:"qcm",prompt:"Este regalo es ___ ti.",options:["por","para"],answer:1,explain:"Destinataire → PARA."},
  {type:"qcm",prompt:"Gracias ___ tu ayuda.",options:["por","para"],answer:0,explain:"Motif/cause → POR."},
  {type:"qcm",prompt:"Necesito el informe ___ el lunes. (échéance)",options:["por","para"],answer:1,explain:"Délai/échéance → PARA."},
  {type:"qcm",prompt:"Caminamos ___ el parque. (lieu de passage)",options:["por","para"],answer:0,explain:"Lieu de passage → POR."},
  {type:"qcm",prompt:"Cambié mi coche ___ una moto. (échange)",options:["por","para"],answer:0,explain:"Échange → POR."}
]},
{id:"g15",lvl:"B1",title:"Les pronoms relatifs",
 html:"<p><b>que</b> : personnes et choses, le plus courant. <b>quien/quienes</b> : personnes, souvent après une préposition. <b>el que / la que / los que / las que</b> : s'accordent en genre/nombre, utiles après une préposition ou pour insister. <b>lo que</b> : relatif neutre pour une idée générale (« ce que »).</p>",
 exercises:[
  {type:"fill",prompt:"La persona <em>___</em> me ayudó es mi vecina.",answer:"que",explain:"« que » : relatif le plus général, sujet ici."},
  {type:"fill",prompt:"El chico con <em>___</em> hablé es muy simpático. (personne + préposition)",answer:"quien",explain:"Après une préposition et pour une personne, « quien » convient bien."},
  {type:"fill",prompt:"No entiendo <em>___</em> dices. (idée générale)",answer:"lo que",explain:"« lo que » : relatif neutre pour une idée, pas un nom précis."},
  {type:"qcm",prompt:"« Los libros ___ compré son interesantes » (que j'ai achetés) :",options:["que","quienes"],answer:0,explain:"Pour une chose (los libros), on utilise « que »."},
  {type:"fill",prompt:"Esta es la razón por <em>___</em> me fui. (la raison pour laquelle, féminin)",answer:"la que",explain:"« por la que » : forme accordée au féminin (la razón)."}
]},
{id:"g16",lvl:"B2",title:"Le subjonctif imparfait et les phrases hypothétiques",
 html:"<p>Formation : 3e personne du pluriel du passé simple, moins <b>-ron</b>, + terminaisons <b>-ra, -ras, -ra, -ramos (avec accent), -rais, -ran</b>. Ex : hablaron → habla<b>ra</b> ; tuvieron → tuvie<b>ra</b>. Structure hypothétique irréelle : <b>Si + imparfait du subjonctif, conditionnel</b> : « Si tuviera dinero, viajaría por el mundo » (Si j'avais de l'argent, je voyagerais).</p>",
 exercises:[
  {type:"fill",prompt:"Si yo <em>___</em> (tener) más tiempo, aprendería a tocar la guitarra.",answer:"tuviera",explain:"tener → tuvieron → tuviera."},
  {type:"fill",prompt:"Si ella <em>___</em> (saber) la verdad, no diría eso.",answer:"supiera",explain:"saber → supieron → supiera."},
  {type:"fill",prompt:"Si nosotros <em>___</em> (poder), te ayudaríamos.",answer:"pudiéramos",explain:"poder → pudieron → pudiéramos (accent sur pudié-)."},
  {type:"qcm",prompt:"La structure correcte pour une hypothèse irréelle au présent est :",options:["Si + imparfait du subjonctif, conditionnel","Si + présent, futur"],answer:0,explain:"« Si + imperfecto de subjuntivo, condicional » exprime une hypothèse irréelle."},
  {type:"fill",prompt:"Si <em>___</em> (hacer) buen tiempo, iríamos a la playa.",answer:"hiciera",explain:"hacer → hicieron → hiciera."}
]},
{id:"g17",lvl:"B2",title:"Le style indirect (discours rapporté)",
 html:"<p>Quand on rapporte une parole au passé, plusieurs éléments changent : présent → imparfait ; passé composé/indefinido → plus-que-parfait ; futur → conditionnel ; « hoy » → « ese día » ; « mañana » → « al día siguiente ». Ex : Dijo: « Estoy cansado » → Dijo que <b>estaba</b> cansado. Dijo: « Vendré mañana » → Dijo que <b>vendría</b> al día siguiente.</p>",
 exercises:[
  {type:"fill",prompt:"Dijo: « Tengo hambre. » → Dijo que <em>___</em> hambre.",answer:"tenía",explain:"Présent → imparfait : tengo → tenía."},
  {type:"fill",prompt:"Dijo: « Iré a la fiesta. » → Dijo que <em>___</em> a la fiesta.",answer:"iría",explain:"Futur → conditionnel : iré → iría."},
  {type:"fill",prompt:"Dijo: « Ya comí. » → Dijo que ya <em>___</em> comido.",answer:"había",explain:"Passé composé/indefinido → plus-que-parfait : había comido."},
  {type:"qcm",prompt:"« hoy » devient, au discours rapporté :",options:["ese día","al día siguiente","ayer"],answer:0,explain:"« hoy » → « ese día » quand on rapporte une parole plus tard."},
  {type:"fill",prompt:"Dijo: « Puedo ayudarte. » → Dijo que <em>___</em> ayudarme.",answer:"podía",explain:"Présent → imparfait : puedo → podía."}
]},
{id:"g18",lvl:"B2",title:"La voix passive et le « se » passif/impersonnel",
 html:"<p><b>Voix passive</b> : ser + participe passé, qui s'accorde en genre et en nombre avec le sujet (« La novela fue escrita por Cervantes »). <b>Se passif</b> : plus naturel en espagnol quand l'agent importe peu, le verbe s'accorde avec la chose (« Se venden pisos » = des appartements sont vendus). <b>Se impersonnel</b> : sujet indéterminé, verbe toujours au singulier (« Se dice que va a llover » ; « Se vive bien aquí »).</p>",
 exercises:[
  {type:"fill",prompt:"La novela <em>___</em> (ser) escrita en 1950.",answer:"fue",explain:"Voix passive : ser (indefinido) + participe : fue escrita."},
  {type:"qcm",prompt:"« On vend des maisons ici » (se passif, pluriel) :",options:["Se vende casas aquí.","Se venden casas aquí."],answer:1,explain:"Le verbe s'accorde avec « casas » (pluriel) : se venden."},
  {type:"fill",prompt:"<em>___</em> dice que el nuevo restaurante es excelente. (se impersonnel)",answer:"Se",explain:"« Se dice que » : tournure impersonnelle très courante."},
  {type:"qcm",prompt:"Dans « se impersonnel », le verbe est toujours :",options:["au singulier","accordé au sujet"],answer:0,explain:"Le « se » impersonnel n'a pas de sujet réel : le verbe reste singulier."},
  {type:"fill",prompt:"Aquí <em>___</em> (hablar) español e inglés. (se passif)",answer:"se habla",explain:"« se habla » : tournure très fréquente sur les panneaux/enseignes."}
]},
{id:"g19",lvl:"B2",title:"Connecteurs discursifs avancés",
 html:"<p>Pour structurer une argumentation à l'oral et à l'écrit : opposition (<i>sin embargo, no obstante, a pesar de</i>), cause/conséquence (<i>por consiguiente, ya que, debido a</i>), reformulation (<i>es decir, dicho de otro modo</i>), ajout d'idée (<i>además, asimismo</i>), conclusion (<i>en resumen, en definitiva</i>).</p>",
 exercises:[
  {type:"qcm",prompt:"« Il pleut ; ___ , nous sortirons quand même. » (opposition)",options:["sin embargo","por consiguiente"],answer:0,explain:"Opposition → sin embargo (cependant)."},
  {type:"qcm",prompt:"« Il n'a pas étudié ; ___ , il a échoué. » (conséquence)",options:["es decir","por consiguiente"],answer:1,explain:"Conséquence → por consiguiente (par conséquent)."},
  {type:"qcm",prompt:"« Est végétarien, ___ , il ne mange pas de viande. » (reformulation)",options:["es decir","además"],answer:0,explain:"Reformulation → es decir (c'est-à-dire)."},
  {type:"qcm",prompt:"« ___ , le projet a été un succès. » (conclusion)",options:["en resumen","en cuanto a"],answer:0,explain:"Conclusion → en resumen (en résumé)."},
  {type:"fill",prompt:"Salimos <em>___</em> la lluvia. (malgré)",answer:"a pesar de",explain:"« a pesar de » = malgré."}
]},
{id:"g20",lvl:"B2",title:"Expressions idiomatiques et locutions figées",
 html:"<p>Le niveau B2 exige de reconnaître et d'utiliser des expressions idiomatiques courantes — impossibles à traduire mot à mot. Retrouve leur sens dans les exercices ci-dessous (elles sont aussi disponibles dans le vocabulaire « Expressions idiomatiques »).</p>",
 exercises:[
  {type:"qcm",prompt:"« Estar en las nubes » signifie :",options:["Être dans la lune","Être très heureux","Voler en avion"],answer:0,explain:"« estar en las nubes » = être distrait, dans la lune."},
  {type:"qcm",prompt:"« Costar un ojo de la cara » signifie :",options:["Être douloureux","Coûter très cher","Être dangereux"],answer:1,explain:"= coûter les yeux de la tête, être très cher."},
  {type:"qcm",prompt:"« Meter la pata » signifie :",options:["Faire une gaffe","Marcher vite","Se blesser au pied"],answer:0,explain:"= faire une gaffe, une bévue."},
  {type:"fill",prompt:"Ponerse las <em>___</em> (se bouger, s'y mettre sérieusement)",answer:"pilas",explain:"« ponerse las pilas » = se mettre les piles, au sens figuré : se motiver."},
  {type:"qcm",prompt:"« Ser pan comido » signifie :",options:["Être du gâteau, très facile","Avoir déjà mangé","Être rassasié"],answer:0,explain:"= être du pain déjà mangé → une chose très facile."}
]}
,
{id:"g21",lvl:"C1",title:"Les concessives : aunque, por más que, por muy… que",
 html:"<p><b>Aunque + indicatif</b> : fait réel ou connu (« Aunque llueve, salgo » — il pleut, je sors quand même). <b>Aunque + subjonctif</b> : hypothèse, fait à venir ou fait admis sans importance (« Aunque llueva, saldré » — même s'il pleut). Même logique avec <b>por más que / por mucho que / por muy + adjectif + que</b> : subjonctif pour une hypothèse ou une supposition, indicatif pour un fait constaté (« Por mucho que estudia, no aprueba » — constat ; « Por mucho que estudies, no aprobarás » — supposition).</p>",
 exercises:[
  {type:"fill",prompt:"Aunque <em>___</em> (llover) mañana, iremos al campo. (hypothèse)",answer:"llueva",explain:"Événement futur incertain → subjonctif : llover → llueva."},
  {type:"qcm",prompt:"« Aunque está enfermo, viene a trabajar » : le verbe est à l'indicatif parce que…",options:["c'est un fait réel","c'est une hypothèse"],answer:0,explain:"Fait constaté → indicatif ; hypothèse → subjonctif."},
  {type:"fill",prompt:"Por mucho que <em>___</em> (tú, insistir), no cambiaré de opinión.",answer:"insistas",explain:"Supposition → subjonctif : insistir → insistas."},
  {type:"fill",prompt:"Por muy cansado que <em>___</em> (él, estar), siempre nos ayuda.",answer:"esté",explain:"« por muy… que » + subjonctif : esté."},
  {type:"qcm",prompt:"« Même si tu me le demandes cent fois, je dirai non » (hypothèse) :",options:["Aunque me lo pides cien veces, diré que no.","Aunque me lo pidas cien veces, diré que no."],answer:1,explain:"Hypothèse sur l'avenir → subjonctif : pidas."}
]},
{id:"g22",lvl:"C1",title:"Le plus-que-parfait du subjonctif : regrets et hypothèses passées",
 html:"<p>Formation : <b>hubiera / hubiese</b> (les deux formes sont correctes) + participe passé : « hubiera sabido ». Pour une hypothèse impossible dans le passé : <b>Si + pluscuamperfecto de subjuntivo, condicional compuesto</b> : « Si lo hubiera sabido, habría venido » (Si je l'avais su, je serais venu). Pour un regret : <b>ojalá + hubiera + participe</b> : « Ojalá hubiera estudiado más ».</p>",
 exercises:[
  {type:"fill",prompt:"Si lo hubiera sabido, te <em>___</em> avisado.",answer:"habría",explain:"Conditionnel composé : habría avisado."},
  {type:"fill",prompt:"Ojalá <em>___</em> estudiado más en el instituto. (regret)",answer:"hubiera|hubiese",explain:"Regret sur le passé : ojalá + hubiera/hubiese + participe."},
  {type:"qcm",prompt:"« Si j'avais su, je n'y serais pas allé » :",options:["Si supiera, no habría ido.","Si hubiera sabido, no habría ido."],answer:1,explain:"Hypothèse passée irréelle : si + hubiera + participe, habría + participe."},
  {type:"qcm",prompt:"Après « hubiera » on emploie :",options:["l'infinitif","le participe passé"],answer:1,explain:"hubiera + participe : hubiera hecho, hubiera dicho…"},
  {type:"fill",prompt:"Si no <em>___</em> perdido el tren, habría llegado a tiempo.",answer:"hubiera|hubiese",explain:"si + hubiera/hubiese + participe."}
]},
{id:"g23",lvl:"C1",title:"Les périphrases verbales",
 html:"<p>Elles nuancent le déroulement de l'action. <b>Acabar de + inf.</b> : venir de (« Acabo de llegar »). <b>Llevar + gérondif</b> : durée (« Llevo tres años estudiando español »). <b>Seguir + gérondif</b> : continuer (« Sigue lloviendo »). <b>Volver a + inf.</b> : refaire (« Volvió a llamar »). <b>Dejar de + inf.</b> : cesser. <b>Soler + inf.</b> : avoir l'habitude. <b>Echarse a + inf.</b> : se mettre à, brusquement (« Se echó a reír »).</p>",
 exercises:[
  {type:"qcm",prompt:"« Il vient de partir » :",options:["Acaba de irse.","Deja de irse."],answer:0,explain:"acabar de + infinitif = venir de."},
  {type:"fill",prompt:"Llevo tres años <em>___</em> español. (j'étudie depuis trois ans)",answer:"estudiando",explain:"llevar + gérondif exprime la durée."},
  {type:"fill",prompt:"Ayer <em>___</em> a llover. (il s'est remis à pleuvoir)",answer:"volvió",explain:"volver a + infinitif = refaire ; ici, indefinido : volvió a llover."},
  {type:"qcm",prompt:"« Siguen viviendo aquí » signifie :",options:["Ils vivent encore ici","Ils ont arrêté de vivre ici"],answer:0,explain:"seguir + gérondif = continuer à."},
  {type:"fill",prompt:"Mi abuelo <em>___</em> levantarse a las seis. (a l'habitude de)",answer:"suele",explain:"soler + infinitif = avoir l'habitude de."}
]},
{id:"g24",lvl:"C1",title:"Les pronoms : « se » accidentel et doubles pronoms",
 html:"<p><b>Se accidentel</b> : pour dire que l'action « arrive » à quelqu'un, sans faute volontaire : « Se me olvidó la llave » (la clé m'est sortie de l'esprit), « Se le cayó el móvil », « Se nos rompió el coche ». Le verbe s'accorde avec la chose, la personne concernée est marquée par me/te/le/nos/os/les. <b>Doubles pronoms</b> : l'ordre est toujours <b>indirect + direct</b> (« Me lo dijo »), et <b>le/les + lo/la</b> devient <b>se lo/se la</b> (« Se lo di »). Avec l'impératif ou l'infinitif, les pronoms se soudent au verbe : « Dámelo », « Quiero dártelo ».</p>",
 exercises:[
  {type:"qcm",prompt:"« Les clés m'ont échappé de l'esprit » (involontaire) :",options:["Olvidé las llaves.","Se me olvidaron las llaves."],answer:1,explain:"Tournure accidentelle : se me olvidaron (le verbe s'accorde avec « las llaves »)."},
  {type:"fill",prompt:"Le di el libro a Ana → <em>___</em> lo di.",answer:"se",explain:"le + lo devient se lo."},
  {type:"fill",prompt:"Se me <em>___</em> el móvil. (il m'est tombé, cassé : romper, indefinido)",answer:"rompió",explain:"Tournure accidentelle : se me rompió el móvil."},
  {type:"qcm",prompt:"L'ordre correct des pronoms est :",options:["Me lo dijo.","Lo me dijo."],answer:0,explain:"Toujours indirect (me) avant direct (lo)."},
  {type:"fill",prompt:"Dá<em>___</em>, por favor. (donne-le-moi : le libro)",answer:"melo",explain:"Impératif : dá + me + lo → dámelo."}
]},
{id:"g25",lvl:"C1",title:"Les conjonctions à subjonctif : a menos que, en caso de que, de ahí que…",
 html:"<p>Ces conjonctions exigent le subjonctif : <b>a menos que / a no ser que</b> (à moins que), <b>con tal de que</b> (pourvu que), <b>en caso de que</b> (au cas où), <b>siempre y cuando</b> (à condition que), <b>de ahí que</b> (d'où le fait que), <b>no sea que</b> (de peur que, au cas où : « Llévate el paraguas, no sea que llueva »), <b>para que / a fin de que</b> (afin que), <b>antes de que</b> (avant que).</p>",
 exercises:[
  {type:"fill",prompt:"Iré a la fiesta a menos que <em>___</em> (llover).",answer:"llueva",explain:"a menos que + subjonctif : llueva."},
  {type:"qcm",prompt:"« En caso de que » est suivi :",options:["du subjonctif","toujours de l'indicatif"],answer:0,explain:"en caso de que + subjonctif."},
  {type:"fill",prompt:"Llévate el paraguas, no <em>___</em> que llueva. (au cas où)",answer:"sea",explain:"no sea que + subjonctif."},
  {type:"fill",prompt:"Es muy caro, de ahí <em>___</em> pocos lo compren.",answer:"que",explain:"de ahí que + subjonctif."},
  {type:"qcm",prompt:"« Te ayudaré con tal de que me lo pidas » : le verbe après « con tal de que » est :",options:["pidas (subjonctif)","pides (indicatif)"],answer:0,explain:"con tal de que + subjonctif."}
]},
{id:"g26",lvl:"C2",title:"Futur et conditionnel de conjecture",
 html:"<p>Le <b>futur</b> sert à faire une supposition sur le <b>présent</b> : « Serán las diez » (il doit être dix heures), « ¿Dónde estará Pedro? » (où peut bien être Pedro ?). Le <b>futur composé</b> supposé sur le <b>passé récent</b> : « Ya habrá llegado » (il sera déjà arrivé). Le <b>conditionnel</b> fait une supposition sur le <b>passé</b> : « Tendría unos cuarenta años » (il devait avoir une quarantaine d'années), « Habría cien personas » (il devait y avoir cent personnes).</p>",
 exercises:[
  {type:"qcm",prompt:"« Serán las tres » signifie :",options:["Il doit être trois heures","Il sera trois heures demain"],answer:0,explain:"Futur de conjecture sur le présent."},
  {type:"fill",prompt:"Ayer <em>___</em> unas cien personas en la sala. (il devait y avoir ; haber au conditionnel)",answer:"habría",explain:"Conditionnel de conjecture sur le passé : habría."},
  {type:"fill",prompt:"No contesta; ya <em>___</em> acostado. (il s'est sans doute couché)",answer:"se habrá",explain:"Futur composé de conjecture : se habrá acostado."},
  {type:"qcm",prompt:"« Tendría unos cuarenta años » signifie :",options:["Il devait avoir une quarantaine d'années","Il aura quarante ans"],answer:0,explain:"Conditionnel de conjecture, tourné vers le passé."},
  {type:"fill",prompt:"¿Dónde <em>___</em> mis gafas? (où peuvent-elles bien être ; estar au futur)",answer:"estarán",explain:"Futur de conjecture : ¿Dónde estarán mis gafas?"}
]},
{id:"g27",lvl:"C2",title:"Le subjonctif redoublé : « digan lo que digan »",
 html:"<p>Formule figée à subjonctif répété, pour dire que rien n'y changera : <b>pase lo que pase</b> (quoi qu'il arrive), <b>digan lo que digan</b> (quoi qu'on dise), <b>cueste lo que cueste</b> (à tout prix), <b>sea como sea</b> (d'une façon ou d'une autre), <b>sea lo que sea</b> (quoi que ce soit), <b>venga quien venga</b> (qui que ce soit qui vienne), <b>vayas donde vayas</b> (où que tu ailles).</p>",
 exercises:[
  {type:"fill",prompt:"<em>___</em> lo que pase, no me rendiré. (quoi qu'il arrive)",answer:"pase",explain:"Pase lo que pase : subjonctif présent répété."},
  {type:"fill",prompt:"Digan lo que <em>___</em>, yo seguiré mi camino.",answer:"digan",explain:"Le verbe est répété au même mode : digan lo que digan."},
  {type:"qcm",prompt:"« Cueste lo que cueste » signifie :",options:["À tout prix","Ça coûte très cher"],answer:0,explain:"Formule concessive : peu importe le coût."},
  {type:"fill",prompt:"Sea <em>___</em> sea, tenemos que terminarlo hoy.",answer:"como",explain:"« sea como sea » = d'une façon ou d'une autre."},
  {type:"qcm",prompt:"Quel mode dans « venga quien venga » ?",options:["Subjonctif","Indicatif"],answer:0,explain:"Ces formules sont toujours au subjonctif."}
]},
{id:"g28",lvl:"C2",title:"« Lo » + adjectif, « lo de », « cuanto más… más »",
 html:"<p><b>Lo + adjectif</b> nomme une qualité en général : « Lo bueno de vivir aquí es el clima » (ce qui est bien…). <b>Lo + adjectif + que</b> exprime l'intensité : « No sabes lo difícil que fue » (à quel point). <b>Lo de + nom</b> renvoie à une affaire connue : « Lo de ayer fue increíble » (ce qui s'est passé hier). Pour la proportionnalité : <b>cuanto más… (tanto) más</b> : « Cuanto más lo pienso, menos me gusta » ; « Cuanto antes, mejor » (le plus tôt sera le mieux).</p>",
 exercises:[
  {type:"fill",prompt:"<em>___</em> bueno de este barrio es que es tranquilo.",answer:"lo",explain:"Lo + adjectif : lo bueno = ce qui est bien."},
  {type:"fill",prompt:"Cuanto más lo pienso, <em>___</em> me gusta la idea. (moins)",answer:"menos",explain:"cuanto más… menos : proportion inverse."},
  {type:"qcm",prompt:"« Lo de ayer » signifie :",options:["Ce qui s'est passé hier, l'affaire d'hier","Le jour d'hier"],answer:0,explain:"« lo de » renvoie à une affaire déjà connue des interlocuteurs."},
  {type:"fill",prompt:"No sabes <em>___</em> difícil que fue. (à quel point)",answer:"lo",explain:"lo + adjectif + que : intensité."},
  {type:"qcm",prompt:"« Cuanto antes, mejor » signifie :",options:["Le plus tôt sera le mieux","Avant que ce soit mieux"],answer:0,explain:"Tournure comparative proportionnelle."}
]},
{id:"g29",lvl:"C2",title:"Participe absolu, « al + infinitif » et registre écrit",

   ============================================================ */

var LEVEL_NAME={B1:"Intermédiaire",B2:"Avancé",C1:"Autonome",C2:"Maîtrise"};
/* Ancien barème d'XP — ne sert plus qu'à retrouver le niveau d'une progression enregistrée avant son abandon */
var LEGACY_XP_THRESHOLDS={B1:0,B2:900,C1:1700,C2:2500};
var BOX_INTERVALS=[1,2,4,9,18,40];
var MASTERED_BOX=3; /* à partir de la boîte 3, le mot compte comme retenu */
var VOCAB_BY_ID={};
VOCAB.forEach(function(w){VOCAB_BY_ID[w.id]=w;});

/* ============================================================
   UTILITAIRES
   ============================================================ */
function pad2(n){return n<10?"0"+n:""+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function dateFromStr(s){var p=s.split("-");return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));}
function addDaysStr(s,n){var d=dateFromStr(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function dayDiff(a,b){return Math.round((dateFromStr(b)-dateFromStr(a))/86400000);}
function norm(s){return (s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");}
function escapeHtml(s){return (s+"").replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
/* Distance de Levenshtein \u2014 pour d\u00e9tecter une r\u00e9ponse \u00ab presque correcte \u00bb (faute de frappe) */
function levenshtein(a,b){
  a=a||""; b=b||"";
  var m=a.length,n=b.length;
  if(!m) return n;
  if(!n) return m;
  var prev=[]; for(var j=0;j<=n;j++) prev[j]=j;
  for(var i=1;i<=m;i++){
    var cur=[i];
    for(var j2=1;j2<=n;j2++){
      cur[j2]=Math.min(prev[j2]+1, cur[j2-1]+1, prev[j2-1]+(a[i-1]===b[j2-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+pad2(sec%60);}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function levelIndex(lvl){return LEVELS.indexOf(lvl);}
function currentLevel(){ return levelIndex(state.level)===-1 ? LEVELS[0] : state.level; }
/* Conversion d'une ancienne progression en XP vers un niveau */
function legacyLevelFromXp(xp){
  var lvl=LEVELS[0];
  for(var i=0;i<LEVELS.length;i++){ if(xp>=LEGACY_XP_THRESHOLDS[LEVELS[i]]) lvl=LEVELS[i]; }
  return lvl;
}
function isMastered(id){ var s=state.srs[id]; return !!(s && s.box>=MASTERED_BOX); }
/* Progression du niveau en cours : mots retenus / mots à voir pour le compléter */
function levelProgress(){
  var lvl=currentLevel();
  var items=VOCAB_BY_LEVEL[lvl]||[];
  var learned=0;
  for(var i=0;i<items.length;i++){ if(isMastered(items[i].id)) learned++; }
  return {
    lvl:lvl, learned:learned, total:items.length,
    remaining:Math.max(0,items.length-learned),
    pct: items.length?Math.round((learned/items.length)*100):0,
    isMax: lvl===LEVELS[LEVELS.length-1],
    complete: items.length>0 && learned>=items.length
  };
}
/* Le vocabulaire du niveau en cours et des niveaux précédents */
function eligibleVocab(){
  var idx=levelIndex(currentLevel());
  return VOCAB.filter(function(w){return levelIndex(w.lvl)<=idx;});
}
/* Tous les mots du niveau retenus → on passe au niveau suivant */
function maybeLevelUp(){
  var p=levelProgress();
  if(!p.complete || p.isMax) return null;
  state.level=LEVELS[levelIndex(p.lvl)+1];
  scheduleSave();
  return {from:p.lvl, to:state.level};
}
/* Accord du pluriel pour les compteurs de mots */
function motsLabel(n){ return n+" mot"+(n>1?"s":""); }

function ensureToday(){
  var t=todayStr();
  if(state.today.date!==t){
    var wasFull=state.today.vocab&&state.today.grammar;
    if(wasFull) state.lastFullDay=state.today.date;
    if(state.lastFullDay){
      var gap=dayDiff(state.lastFullDay,t);
      if(gap>1) state.streak=0;
    } else {
      state.streak=0;
    }
    state.today={date:t,vocab:false,grammar:false};
  }
}

var pendingWrite=false;
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    saveTimer=null;
    if(dbDoc){
      pendingWrite=false;
      var clone=JSON.parse(JSON.stringify(state));
      dbDoc.set(clone).catch(function(e){ console.warn("db save failed",e); });
    } else {
      pendingWrite=true; // la connexion n'est pas encore prête : boot() rejouera l'écriture dès qu'elle le sera
    }
  },350);
}

function markSessionDone(kind){
  var already=state.today[kind];
  state.today[kind]=true;
  var justCompletedDay=false;
  if(!already && state.today.vocab && state.today.grammar){
    var t=state.today.date;
    if(state.lastFullDay && dayDiff(state.lastFullDay,t)===1){
      state.streak+=1;
    } else {
      state.streak=1;
    }
    state.lastFullDay=t;
    justCompletedDay=true;
  }
  scheduleSave();
  return {justCompletedDay:justCompletedDay};
}

/* ============================================================
   MOTEUR SRS — sélection du vocabulaire
   ============================================================ */
function pickVocabQueue(theme){
  var t=todayStr();
  var pool=eligibleVocab();
  if(theme) pool=pool.filter(function(w){return w.th===theme;});
  var due=[], fresh=[];
  pool.forEach(function(w){
    var s=state.srs[w.id];
    if(!s) fresh.push(w);
    else if(s.due<=t) due.push(w);
  });
  due.sort(function(a,b){return state.srs[a.id].due<state.srs[b.id].due?-1:1;});
  var target=Math.min(10,pool.length);
  var queue=due.slice(0,target);
  if(queue.length<target){
    queue=queue.concat(shuffle(fresh).slice(0,target-queue.length));
  }
  if(queue.length<target){
    var extra=shuffle(pool.filter(function(w){return queue.indexOf(w)===-1;}));
    queue=queue.concat(extra.slice(0,target-queue.length));
  }
  return shuffle(queue).map(function(w){return w.id;});
}

function rateVocab(id,easy){
  var s=state.srs[id]||{box:-1,due:todayStr()};
  if(easy){ s.box=Math.min(5,s.box+1); }
  else { s.box=0; }
  s.due=addDaysStr(todayStr(),BOX_INTERVALS[Math.max(0,s.box)]);
  state.srs[id]=s;
  scheduleSave();
}

function toggleFavorite(id){
  if(state.favorites[id]) delete state.favorites[id];
  else state.favorites[id]=true;
  scheduleSave();
}

/* Compte, sur le vocabulaire disponible (ou sur une seule situation) : retenus, favoris, à repasser */
function vocabCounts(theme){
  var pool=eligibleVocab();
  if(theme) pool=pool.filter(function(w){return w.th===theme;});
  var mastered=0, favorites=0;
  pool.forEach(function(w){
    if(isMastered(w.id)) mastered++;
    if(state.favorites[w.id]) favorites++;
  });
  return {total:pool.length, mastered:mastered, favorites:favorites, toReview:pool.length-mastered};
}

/* ============================================================
   GRAMMAIRE — sélection de la leçon
   ============================================================ */
function pickGrammarLesson(){
  var lvlIdx=levelIndex(currentLevel());
  for(var i=0;i<GRAMMAR.length;i++){
    var g=GRAMMAR[i];
    if(levelIndex(g.lvl)<=lvlIdx && state.grammarDone.indexOf(g.id)===-1) return g;
  }
  if(state.grammarDone.length){
    var doneAtLvl=GRAMMAR.filter(function(g){return state.grammarDone.indexOf(g.id)!==-1;});
    if(doneAtLvl.length) return doneAtLvl[Math.floor(Math.random()*doneAtLvl.length)];
  }
  return GRAMMAR[0];
}

/* ============================================================
   SON — repère sonore du mode voiture
   ============================================================ */
function playTone(freq){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    var t0=audioCtx.currentTime;
    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(.14,t0+.06);
    gain.gain.linearRampToValueAtTime(0,t0+.9);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0+.95);
  }catch(e){}
}

/* ============================================================
   SON — prononciation du vocabulaire (synthèse vocale)
   ============================================================ */
function speak(text,lang){
  try{
    if(!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* Lit plusieurs textes à la suite (ex. le mot, puis la phrase d'exemple) */
function speakSequence(parts){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var queue=parts.filter(function(p){return p && p.text;});
    if(!queue.length) return;
    var i=0;
    function next(){
      if(i>=queue.length) return;
      var p=queue[i++];
      var u=new SpeechSynthesisUtterance(p.text);
      u.lang=p.lang;
      u.rate=0.9;
      u.onend=next;
      u.onerror=next;
      window.speechSynthesis.speak(u);
    }
    next();
  }catch(e){}
}

/* ============================================================
   VUE — Modo coche
   Pantalla completa, cuatro botones enormes (colores de la bandera
   española), una sola función por botón, todo al oído :
     De arriba abajo :
     Amarillo — marca la palabra « sabida »
     Negro    — repite la frase (francés, luego español)
     Verde    — pasa a la palabra siguiente (y registra el resultado)
     Rojo     — marca la palabra « a repasar »
   La frase se lee sola al llegar a cada palabra y se muestra
   siempre en texto grande.
   Sin marca, la palabra se cuenta « sabida » al pasar.
   ============================================================ */
var CAR_DECK_SIZE=30;
var carS={deck:[],i:0,mark:"",ok:0};

function viewCar(){
  var html=topBar();
  html+='<main class="main">';
  html+='<div class="session-header"><h2>Modo coche</h2><button class="iconbtn" data-action="nav" data-view="dashboard">✕</button></div>';
  html+='<div class="quote-card" style="text-align:left">';
  html+='<p style="margin:0 0 10px;font-weight:700">Pantalla completa, cuatro botones enormes, todo al oído.</p>';
  html+='<p style="margin:0;color:var(--ink-soft);font-size:.88rem;line-height:1.6">Repasa vocabulario sin mirar la pantalla — ideal para el coche.<br><br>Amarillo: sabida · Negro: repetir · Verde: palabra siguiente · Rojo: a repasar.</p>';
  html+='</div>';
  html+='<button class="btn btn-green btn-wide btn-lg" data-action="car-start">Comenzar</button>';
  html+='</main>';
  html+=navBar("car");
  return html;
}

function viewCarDrill(){
  if(!carS.deck.length) buildCarDeck();
  var txt='';
  if(carS.deck.length){
    var w=VOCAB_BY_ID[carS.deck[carS.i]];
    txt='<div class="car-text"><div class="car-fr">'+escapeHtml(w.xfr||w.fr)+'</div><div class="car-es">'+escapeHtml(w.xes||w.es)+'</div></div>';
  }
  return '<div class="car-overlay">'+
    '<button class="car-exit" data-action="car-exit" aria-label="Salir del modo coche">✕</button>'+
    txt+
    '<div class="car-pad">'+
      '<button class="car-btn car-btn-known'+(carS.mark==="known"?' sel':'')+'" data-action="car-known" aria-label="Sabida"><span class="car-ico">✓</span>Connu</button>'+
      '<button class="car-btn car-btn-repeat" data-action="car-repeat" aria-label="Repetir la frase"><span class="car-ico">↻</span>Répète</button>'+
      '<button class="car-btn car-btn-next" data-action="car-next" aria-label="Palabra siguiente"><span class="car-ico">›</span>Suivant</button>'+
      '<button class="car-btn car-btn-review'+(carS.mark==="review"?' sel':'')+'" data-action="car-review" aria-label="A repasar"><span class="car-ico">✕</span>À revoir</button>'+
    '</div>'+
  '</div>';
}

function carClean(t){ return (t||"").replace(/\s*\(.*?\)/g,"").trim(); }

function buildCarDeck(){
  var t=todayStr();
  var pool=eligibleVocab();
  var due=[],fresh=[],rest=[];
  pool.forEach(function(w){
    var s=state.srs[w.id];
    if(!s) fresh.push(w);
    else if(s.due<=t) due.push(w);
    else rest.push(w);
  });
  carS.deck=shuffle(due).concat(shuffle(fresh),shuffle(rest)).slice(0,CAR_DECK_SIZE).map(function(w){return w.id;});
  carS.i=0; carS.mark=""; carS.ok=0;
}

function carPlay(){
  if(!carS.deck.length) buildCarDeck();
  if(!carS.deck.length) return;
  var w=VOCAB_BY_ID[carS.deck[carS.i]];
  speakSequence([
    {text:carClean(w.xfr||w.fr),lang:"fr-FR"},
    {text:carClean(w.xes||w.es),lang:"es-ES"}
  ]);
}

function carSetMark(m){
  if(!carS.deck.length) return;
  carS.mark=m;
  if(state.settings.sound) playTone(m==="review"?300:600);
  render();
}

function carNext(){
  if(!carS.deck.length) buildCarDeck();
  if(!carS.deck.length) return;
  var ok=carS.mark!=="review";
  rateVocab(carS.deck[carS.i],ok);
  if(ok){ maybeLevelUp(); carS.ok++; }
  carS.mark="";
  carS.i++;
  if(carS.i>=carS.deck.length) buildCarDeck();
  render();
  carPlay();
}

/* ============================================================
   Écran de fin de séance
   ============================================================ */
function doneScreen(kind,title,sub,recap){
  var color={vocab:"var(--yellow)",grammar:"var(--ink-soft)"}[kind];
  var soft={vocab:"var(--yellow-soft)",grammar:"var(--surface-2)"}[kind];
  var chip='';
  if(kind==="vocab"){
    var lp=ui.lastProgress||levelProgress();
    var gain=ui.lastLearnedGain||0;
    chip='<span class="gain-chip">'+(gain>0?'+'+gain+' · ':'')+lp.learned+' / '+lp.total+' mots retenus · '+lp.lvl+'</span>';
  } else if(kind==="grammar"){
    chip='<span class="gain-chip">'+state.grammarDone.length+' / '+GRAMMAR.length+' leçons de grammaire</span>';
  }
  var recapHtml='';
  if(recap && recap.length){
    if(kind==="vocab"){
      recapHtml='<div class="recap"><p class="recap-title">Para repasar ('+recap.length+')</p>'+recap.map(function(w){
        return '<div class="recap-item"><span class="recap-mark near">~</span><div class="recap-body">'+escapeHtml(w.fr)+' → <b>'+escapeHtml(w.es)+'</b></div></div>';
      }).join("")+'</div>';
    } else if(kind==="grammar"){
      recapHtml='<div class="recap"><p class="recap-title">Para repasar ('+recap.length+')</p>'+recap.map(function(r){
        return '<div class="recap-item"><span class="recap-mark '+(r.near?"near":"bad")+'">'+(r.near?"~":"✕")+'</span><div class="recap-body">'+r.prompt+'<br><span class="recap-you'+(r.near?" near":"")+'">Tú: '+escapeHtml(r.your||"—")+'</span> · Correcto: <b>'+escapeHtml(r.correct)+'</b></div></div>';
      }).join("")+'</div>';
    }
  }
  return '<main class="main"><div class="done-wrap">'+
    '<div class="done-badge" style="background:'+soft+';color:'+color+'">✓</div>'+
    '<h2>'+title+'</h2><p>'+sub+'</p>'+
    (ui.levelUp?'<p class="done-levelup">🎉 ¡Nivel '+ui.levelUp.to+'! Tous les mots du niveau '+ui.levelUp.from+' sont retenus.</p>':'')+
    chip+
    (kind==="vocab"?'<p class="done-note">Un mot compte comme retenu après quatre rappels réussis, espacés dans le temps.</p>':'')+
    recapHtml+
    '<button class="btn btn-yellow btn-lg btn-wide" data-action="exit-session">Volver al inicio</button>'+
  '</div></main>';
}

/* ============================================================
   ACTIONS — factorisées pour être appelées au clic ET au clavier
   ============================================================ */
function doCardTap(){
  if(!ui.vq || ui.vq.flipped) return;
  var vq=ui.vq;
  var w=VOCAB_BY_ID[vq.queue[vq.idx]];
  if(!w) return;
  if(!vq.spoken){
    // 1er toque : lit le mot puis la phrase en français, la carte reste de face
    vq.spoken=true;
    speakSequence([{text:w.fr,lang:"fr-FR"},{text:w.xfr,lang:"fr-FR"}]);
  } else {
    // 2e toque : retourne la carte, lit automatiquement le mot puis la phrase en español
    vq.flipped=true;
    speakSequence([{text:w.es,lang:"es-ES"},{text:w.xes,lang:"es-ES"}]);
  }
  render();
}
function doSpeakCurrent(){
  if(!ui.vq) return;
  var w=VOCAB_BY_ID[ui.vq.queue[ui.vq.idx]];
  if(!w) return;
  if(ui.vq.flipped) speakSequence([{text:w.es,lang:"es-ES"},{text:w.xes,lang:"es-ES"}]);
  else speakSequence([{text:w.fr,lang:"fr-FR"},{text:w.xfr,lang:"fr-FR"}]);
}
function doRateVocab(easy){
  if(!ui.vq || !ui.vq.flipped) return;
  var w=VOCAB_BY_ID[ui.vq.queue[ui.vq.idx]];
  if(!easy && w) ui.vq.missed.push({es:w.es,fr:w.fr});
  rateVocab(ui.vq.queue[ui.vq.idx],easy);
  ui.vq.idx++;
  ui.vq.flipped=false;
  ui.vq.spoken=false;
  if(ui.vq.idx>=ui.vq.queue.length){
    var snap=levelProgress();
    ui.lastProgress={lvl:snap.lvl,learned:snap.learned,total:snap.total};
    ui.lastLearnedGain=Math.max(0,snap.learned-(ui.vq.learnedStart||0));
    var res=markSessionDone("vocab");
    if(res.justCompletedDay) ui.dayFlash=true;
    var lu=maybeLevelUp();
    if(lu) ui.levelUp=lu;
  }
  render();
}
function doStartExercises(){
  if(!ui.gq) return;
  ui.gq.exIdx=0;
  ui.gq.answered=false;
  render();
}
function doAnswerQcm(idx){
  if(!ui.gq || ui.gq.answered) return;
  var lesson=GRAMMAR_BY_ID[ui.gq.lessonId];
  var ex=lesson.exercises[ui.gq.exIdx];
  ui.gq.chosen=idx;
  ui.gq.answered=true;
  ui.gq.lastNear=false;
  ui.gq.lastOk=(idx===ex.answer);
  if(ui.gq.lastOk) ui.gq.correct++;
  else ui.gq.wrong.push({prompt:ex.prompt,your:ex.options[idx],correct:ex.options[ex.answer],near:false});
  render();
}
function doAnswerFill(){
  if(!ui.gq || ui.gq.answered) return;
  var lesson2=GRAMMAR_BY_ID[ui.gq.lessonId];
  var ex2=lesson2.exercises[ui.gq.exIdx];
  var inputEl=document.getElementById("fillInput");
  var val=inputEl?inputEl.value:"";
  var variants=ex2.answer.split("|").map(norm);
  var nv=norm(val), na=variants[0];
  var ok=variants.indexOf(nv)!==-1;
  // « presque » : une seule lettre d'écart, réservé aux réponses assez longues pour éviter les faux positifs
  var near=!ok && nv.length>0 && na.length>=4 && levenshtein(nv,na)<=1;
  ui.gq.answered=true;
  ui.gq.lastOk=ok;
  ui.gq.lastNear=near;
  ui.gq.lastYourInput=val;
  if(ok) ui.gq.correct++;
  else ui.gq.wrong.push({prompt:ex2.prompt,your:val,correct:ex2.answer.split("|").join(" / "),near:near});
  render();
}
function doNextExercise(){
  if(!ui.gq) return;
  var lesson3=GRAMMAR_BY_ID[ui.gq.lessonId];
  ui.gq.exIdx++;
  ui.gq.answered=false;
  ui.gq.chosen=null;
  ui.gq.lastNear=false;
  ui.gq.lastYourInput="";
  if(ui.gq.exIdx>=lesson3.exercises.length){
    if(state.grammarDone.indexOf(ui.gq.lessonId)===-1) state.grammarDone.push(ui.gq.lessonId);
    var res2=markSessionDone("grammar");
    if(res2.justCompletedDay) ui.dayFlash=true;
    scheduleSave();
  }
  render();
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
document.getElementById("app").addEventListener("click",function(e){
  var t=e.target.closest("[data-action]");
  if(!t) return;
  var action=t.getAttribute("data-action");

  if(action==="nav"){
    exitTransientQueues();
    ui.view=t.getAttribute("data-view");
    ui.dayFlash=false;
    ui.levelUp=null;
    render();
  } else if(action==="start-level"){
    state.level=t.getAttribute("data-level");
    state.onboarded=true;
    scheduleSave();
    ui.view="dashboard";
    render();
  } else if(action==="enter-session"){
    var kind=t.getAttribute("data-kind");
    ui.view=kind;
    ui.dayFlash=false;
    ui.levelUp=null;
    render();
  } else if(action==="start-vocab"){
    var vth=t.getAttribute("data-theme")||"";
    var vqueue=pickVocabQueue(vth);
    if(!vqueue.length) return;
    ui.vq={queue:vqueue,idx:0,flipped:false,spoken:false,missed:[],theme:vth,learnedStart:levelProgress().learned};
    ui.dayFlash=false;
    ui.levelUp=null;
    render();
  } else if(action==="exit-session"){
    exitTransientQueues();
    ui.view="dashboard";
    render();
  } else if(action==="card-tap"){
    doCardTap();
  } else if(action==="speak-current"){
    doSpeakCurrent();
  } else if(action==="toggle-favorite"){
    toggleFavorite(t.getAttribute("data-id"));
    render();
  } else if(action==="rate-vocab"){
    doRateVocab(t.getAttribute("data-easy")==="1");
  } else if(action==="start-exercises"){
    doStartExercises();
  } else if(action==="answer-qcm"){
    doAnswerQcm(parseInt(t.getAttribute("data-idx"),10));
  } else if(action==="answer-fill"){
    doAnswerFill();
  } else if(action==="next-exercise"){
    doNextExercise();
  } else if(action==="car-start"){
    ui.view="cardrill";
    if(!carS.deck.length) buildCarDeck();
    render();
    carPlay();
  } else if(action==="car-exit"){
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    ui.view="car";
    render();
  } else if(action==="car-review"){
    carSetMark("review");
  } else if(action==="car-known"){
    carSetMark("known");
  } else if(action==="car-repeat"){
    carPlay();
  } else if(action==="car-next"){
    carNext();
  } else if(action==="toggle-sound"){
    state.settings.sound=!state.settings.sound;
    scheduleSave();
    render();
  } else if(action==="set-level"){
    state.level=t.getAttribute("data-level");
    scheduleSave();
    render();
  } else if(action==="reset-progress"){
    if(window.confirm("Réinitialiser toute ta progression ? Cette action est irréversible.")){
      var keepSound=state.settings.sound;
      state=defaultState();
      state.onboarded=false;
      state.settings.sound=keepSound;
      scheduleSave();
      render();
    }
  }
});

function exitTransientQueues(){
  ui.vq=null; ui.gq=null; ui.lastLearnedGain=null; ui.lastProgress=null;
}

/* ============================================================
   ATAJOS DE TECLADO — reprend l'esprit « mains sur le clavier »
   du FCL 0.55 Trainer (␣ pour voltear, ⏎ pour valider/continuar)
   ============================================================ */
document.addEventListener("keydown",function(e){
  if(!state.onboarded || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  var tag=(document.activeElement&&document.activeElement.tagName)||"";
  if(ui.view==="vocab" && ui.vq && ui.vq.idx<ui.vq.queue.length){
    if(!ui.vq.flipped){
      if(e.key===" "){ e.preventDefault(); doCardTap(); }
    } else {
      if(e.key==="1"){ e.preventDefault(); doRateVocab(false); }
      else if(e.key==="2"){ e.preventDefault(); doRateVocab(true); }
    }
  } else if(ui.view==="grammar" && ui.gq){
    var lesson=GRAMMAR_BY_ID[ui.gq.lessonId];
    if(ui.gq.exIdx===-1){
      if(e.key==="Enter"){ e.preventDefault(); doStartExercises(); }
    } else if(ui.gq.exIdx<lesson.exercises.length){
      if(ui.gq.answered){
        if(e.key==="Enter"){ e.preventDefault(); doNextExercise(); }
      } else if(e.key==="Enter" && tag==="INPUT"){
        e.preventDefault(); doAnswerFill();
      }
    }
  }
});

/* ============================================================
   DÉMARRAGE + SYNCHRONISATION
   ============================================================ */
function applyRemoteState(data){
  if(!data) return;
  data=JSON.parse(JSON.stringify(data)); // clone : les objets du snapshot Firestore sont gelés (non extensibles), il faut une copie mutable avant d'y ajouter des clés (state.srs[id]=..., state.favorites[id]=...)
  state=Object.assign(defaultState(),data);
  state.today=data.today||defaultState().today;
  state.srs=data.srs||{};
  state.grammarDone=data.grammarDone||[];
  state.favorites=data.favorites||{};
  state.settings=Object.assign({sound:true},data.settings||{});
  /* progression enregistrée avant l'abandon des XP : on en déduit le niveau une fois pour toutes */
  if(typeof data.level!=="string" || levelIndex(data.level)===-1){
    state.level=(typeof data.xp==="number")?legacyLevelFromXp(data.xp):LEVELS[0];
  }
  delete state.xp;
  ensureToday();
}

function boot(){
  ensureToday();
  render();
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(db){
      if(!db) return;
      dbHandle=db;
      dbDoc=db.doc("progress/state");
      dbDoc.onSnapshot(function(snap){
        if(pendingWrite){
          // des changements locaux (ex. choix du niveau initial) ont eu lieu
          // avant que la connexion ne soit prête : on les préserve et on les écrit maintenant,
          // plutôt que d'écraser l'état local avec un instantané distant potentiellement obsolète.
          pendingWrite=false;
          var clone=JSON.parse(JSON.stringify(state));
          dbDoc.set(clone).catch(function(e){ console.warn("db save failed",e); });
        } else if(snap.exists){
          applyRemoteState(snap.data());
        }
        render();
      },function(err){
        console.warn("db sync error",err);
      });
    }).catch(function(){});
  }
}

boot();

})();
</script>
